image fip/u-boot.bin.sd.bin {
        file {
                holes = {"(444; 512)"}
        }
}

image sdcard.img {
	hdimage {
		mbr-skip-optionals = "true"
	}

        partition uboot {
                in-partition-table = "no"
                image = "fip/u-boot.bin.sd.bin"
                offset = 0K
        }

	partition rootfs {
		partition-type = 0x83
		bootable = "true"
		image = "rootfs.ext2"
		size = 128M
		offset = 0
	}
}
